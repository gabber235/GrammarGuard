name: grammar_guard
description: "Enhance, rewrite, and format selected text from anywhere"
publish_to: "none"
version: 1.1.1+4

environment:
  sdk: ^3.13.0
  flutter: 3.47.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.0
  riverpod_annotation: ^4.0.0

  # Networking
  dio: ^5.0.0
  url_launcher: ^6.0.0

  # Storage
  shared_preferences: ^2.0.0
  path_provider: ^2.0.0
  flutter_secure_storage: ^11.2.0

  # Window management
  window_manager: ^0.5.0
  hotkey_manager: ^0.2.0
  tray_manager: ^0.8.0
  flutter_acrylic: ^1.1.4

  # Look and motion
  flutter_animate: ^4.5.2
  animations: ^3.0.0

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  diff_match_patch: ^0.4.0
  gpt_markdown: ^1.0.0
  markdown: ^7.0.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4
  clock: ^1.1.3
  file: ^7.0.1

  # AI
  llm_dart:
    git: https://github.com/gabber235/llm_dart.git
  collection: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints:
  alchemist: ^0.14.1

  # Code generation
  build_runner:
  riverpod_generator:
  freezed:
  json_serializable:

  # Linting
  riverpod_lint:

flutter:
  uses-material-design: true
  assets:
    - assets/library.yaml
    - assets/models.json
    - assets/tray_icon.ico
    - assets/tray_icon.png
    - assets/tray_icon@2x.png
  fonts:
    - family: Atkinson Hyperlegible Next
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
    - family: Atkinson Hyperlegible Mono
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleMono-Regular.ttf
