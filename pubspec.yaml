name: grammar_guard
description: "Enhance, rewrite, and format selected text from anywhere"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  hooks_riverpod: ^3.0.0-dev.15
  flutter_hooks: ^0.21.2
  riverpod_annotation: ^3.0.0-dev.15

  # Networking
  dio: ^5.8.0+1
  url_launcher: ^6.3.1

  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Window management
  window_manager: ^0.5.0
  hotkey_manager: ^0.2.3

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  diff_match_patch: ^0.4.1
  gpt_markdown: ^1.0.16

  # AI
  llm_dart:
    git: https://github.com/gabber235/llm_dart.git
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

  # Code generation
  build_runner:
  riverpod_generator:
  freezed:
  json_serializable:

  # Linting
  custom_lint:
  riverpod_lint:

flutter:
  uses-material-design: true
