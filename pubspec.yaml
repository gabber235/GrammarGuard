name: grammar_guard
description: "Enhance, rewrite, and format selected text from anywhere"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.0

  # State management
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.0
  riverpod_annotation: ^4.0.0

  # Networking
  dio: ^5.0.0
  url_launcher: ^6.0.0

  # Storage
  shared_preferences: ^2.0.0
  path_provider: ^2.0.0
  flutter_secure_storage: ^11.2.0

  # Window management
  window_manager: ^0.5.0
  hotkey_manager: ^0.2.0

  # Serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0
  diff_match_patch: ^0.4.0
  gpt_markdown: ^1.0.0

  # AI
  llm_dart:
    git: https://github.com/gabber235/llm_dart.git
  collection: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:

  # Code generation
  build_runner:
  riverpod_generator:
  freezed:
  json_serializable:

  # Linting
  riverpod_lint:

flutter:
  uses-material-design: true
