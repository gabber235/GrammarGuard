name: grammar_guard
description: "Enhance, rewrite, and format selected text from anywhere"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0-70.0.dev

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  riverpod_annotation: ^2.6.1

  # Networking
  dio: ^5.8.0+1
  url_launcher: ^6.2.5

  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Window management
  window_manager: ^0.4.3
  hotkey_manager: ^0.2.3

  # Models and serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  google_generative_ai: ^0.4.6
  diff_match_patch: ^0.4.1
  gpt_markdown: ^1.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.4
  json_serializable: ^6.9.4

  # Linting
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/env/
    - assets/images/
    - assets/fonts/
