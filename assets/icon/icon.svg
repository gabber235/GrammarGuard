<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- GrammarGuard: the review on its glass. The rail's yellow pill marks
       the change under review, highlighted in the text beside it. -->
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="1" stop-color="#1B1F27"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: an 824 square, inset 100, corner radius 185 -->
  <g filter="url(#drop)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glass)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="3"/>

  <!-- The rail: a hairline and the pill on the current change -->
  <rect x="322" y="250" width="8" height="524" rx="4" fill="#FFFFFF" fill-opacity="0.16"/>
  <rect x="226" y="436" width="64" height="128" rx="32" fill="#FFC94D"/>
  <circle cx="258" cy="312" r="18" fill="#5A6375"/>
  <circle cx="258" cy="712" r="18" fill="#5A6375"/>

  <!-- Lines of text; the middle one holds the change -->
  <rect x="376" y="282" width="420" height="60" rx="30" fill="#EDEFF3" fill-opacity="0.9"/>
  <rect x="356" y="420" width="464" height="160" rx="44" fill="#FFC94D" fill-opacity="0.32"/>
  <rect x="388" y="470" width="160" height="60" rx="30" fill="#EDEFF3" fill-opacity="0.9"/>
  <rect x="576" y="470" width="212" height="60" rx="30" fill="#5EE0C2"/>
  <rect x="376" y="682" width="320" height="60" rx="30" fill="#EDEFF3" fill-opacity="0.9"/>
</svg>
