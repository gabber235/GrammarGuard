inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Flutter, by the exact version pubspec.yaml pins.
  flutter-overlay:
    url: github:gabber235/flutter-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
# _1password-cli is the only unfree package; secretspec reads 1Password through it.
nixpkgs:
  permitted_unfree_packages:
    - 1password-cli
