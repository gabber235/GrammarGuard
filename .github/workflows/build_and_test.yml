name: Build and Test

on:
  # Branches are checked through their pull request; main after each merge.
  push:
    branches:
      - main
  pull_request:

jobs:
  # The same check as `devenv test` on a laptop: generated code, formatting,
  # analysis, every test and the git hooks, with the Flutter pubspec.yaml pins.
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      # tool/flutter-sdk.sh installs the pinned Flutter here once.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/flutter-sdk
          key: flutter-sdk-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: flutter-sdk-${{ runner.os }}-

      - name: Check
        run: devenv test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/

  # The real app on each OS with only the model faked. Linux runs on every
  # push (its runner is cheap); macOS and Windows on pull requests only: their
  # runners are slow and the unit and flow tests cover the logic.
  integration-linux:
    needs: test-and-analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libkeybinder-3.0-dev libxtst-dev libayatana-appindicator3-dev xvfb

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Integration test
        run: xvfb-run -a flutter test integration_test -d linux

  integration-macos:
    if: github.event_name == 'pull_request'
    needs: test-and-analyze
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Integration test
        run: flutter test integration_test -d macos

  integration-windows:
    if: github.event_name == 'pull_request'
    needs: test-and-analyze
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Integration test
        run: flutter test integration_test -d windows

  # Release builds of every pull request, packaged exactly as a release is
  # (tool/release.sh), to download and try before merging. Also proves the
  # packaging works before a real release depends on it.
  build-macos:
    needs: test-and-analyze
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Build
        run: |
          flutter pub get
          flutter build macos --release
          tool/release.sh macos

      - uses: actions/upload-artifact@v4
        with:
          name: GrammarGuard-macos
          path: dist/
          retention-days: 14

  build-linux:
    needs: test-and-analyze
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libkeybinder-3.0-dev libxtst-dev libayatana-appindicator3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Build
        run: |
          flutter pub get
          flutter build linux --release
          tool/release.sh linux "0.0.0~pr${{ github.event.number || github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GrammarGuard-linux
          path: dist/
          retention-days: 14

  build-windows:
    needs: test-and-analyze
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release
          tool/release.sh windows "0.0.0.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: GrammarGuard-windows
          path: dist/
          retention-days: 14
