[project]
name = "grammarguard"
revision = "1.0"

# Values live in the 1Password vault "GrammarGuard" (SECRETSPEC_PROVIDER in
# devenv.nix). Without 1Password, export EVAL_API_KEY and run with
# SECRETSPEC_PROVIDER=env.
[profiles.default]
EVAL_API_KEY = { description = "API key of the backend eval-model measures; not needed for local models", required = false }
